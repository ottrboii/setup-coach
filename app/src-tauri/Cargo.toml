[package]
name = "setup-coach-app"
version = "0.1.0"
edition = "2021"
description = "Setup Coach: mic, camera and stream setup coach for streamers"
publish = false

[lib]
name = "setup_coach_app"
path = "src/lib.rs"

[[bin]]
name = "setup-coach"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
coach_core = { path = "../../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
async-trait = "0.1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["zip", "native-tls"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
winreg = "0.55"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_MediaFoundation",
  "Win32_Media_DirectShow",
  "Win32_Media_KernelStreaming",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_FaceAnalysis",
  "Security_Cryptography",
  "Storage_Streams",
] }

[dev-dependencies]
tempfile = "3"

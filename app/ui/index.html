<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Setup Coach</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Setup steps">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3a4 4 0 0 1 4 4v5a4 4 0 0 1-8 0V7a4 4 0 0 1 4-4Z" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name">Setup Coach</span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-bottom">
        <button type="button" id="notes-btn" class="notes-btn" aria-haspopup="dialog" title="Tell us what is wrong (Ctrl+Shift+F)">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span class="label">Tell us what's wrong</span><span class="draft-dot" data-draft hidden title="You have an unsaved note">&bull;</span>
        </button>
        <div class="sidebar-foot" id="obs-pill"></div>
      </div>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>

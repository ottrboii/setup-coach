# Builds the signed installer + updater manifest and creates a DRAFT GitHub
# release. It never publishes: Otto reviews the draft and presses Publish.
# One-time setup (keys, secrets, variable): see RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0). Must already exist."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed installer + draft release
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check signing setup
        shell: pwsh
        run: |
          $missing = @()
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { $missing += 'secret TAURI_SIGNING_PRIVATE_KEY' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { $missing += 'secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD' }
          if (-not $env:UPDATER_PUBKEY) { $missing += 'variable TAURI_UPDATER_PUBKEY' }
          if ($missing.Count -gt 0) {
            Write-Host "::error title=Release signing is not set up::Missing: $($missing -join ', '). Follow the one-time setup in RELEASING.md (GitHub > Settings > Secrets and variables > Actions)."
            exit 1
          }
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+') { Write-Host "::error::Tag '$env:TAG' is not of the form vX.Y.Z"; exit 1 }

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag must match the app version
        shell: pwsh
        run: |
          $conf = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $want = $env:TAG.TrimStart('v')
          if ($conf.version -ne $want) {
            Write-Host "::error::Tag $env:TAG does not match version $($conf.version) in app/src-tauri/tauri.conf.json. Bump the version, commit, and tag again."
            exit 1
          }
          "VERSION=$want" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test core + app
        run: cargo test --workspace --release

      - name: Build + test VST3
        run: |
          cmake -S vst3 -B build-vst3 -DSC_BUILD_PLUGIN=ON
          cmake --build build-vst3 --config Release
          ctest --test-dir build-vst3 -C Release --output-on-failure

      - name: Build signed installer (bundles VST3, updater artifacts)
        shell: pwsh
        working-directory: app
        run: |
          # The public key is not in the repo: inject it from the repository variable.
          @{ plugins = @{ updater = @{ pubkey = $env:UPDATER_PUBKEY } } } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 ../pubkey.conf.json
          npx --yes @tauri-apps/cli@2 build --config src-tauri/tauri.vst3.conf.json --config src-tauri/tauri.release.conf.json --config ../pubkey.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check installer contains VST3 and is signed
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $sig = Get-ChildItem target/release/bundle/nsis/*.exe.sig | Select-Object -First 1
          if (-not $exe -or -not $sig) { throw 'installer or .sig missing (is createUpdaterArtifacts on?)' }
          $hits = & 7z l $exe.FullName | Select-String -Pattern 'x86_64-win[\\/]SetupCoachVoice\.vst3'
          if (-not $hits) { throw 'VST3 binary not found in installer' }
          Write-Host "Installer: $($exe.Name), signature: $($sig.Name)"

      - name: Installer end-to-end
        shell: pwsh
        run: .github/scripts/installer-e2e.ps1

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $sig = Get-ChildItem target/release/bundle/nsis/*.exe.sig | Select-Object -First 1
          # Space-free name so the URL in latest.json matches the uploaded asset exactly.
          $name = "Setup-Coach_${env:VERSION}_x64-setup.exe"
          Copy-Item $exe.FullName "release/$name"
          $notes = (git for-each-ref "refs/tags/$env:TAG" --format='%(contents)') -join "`n"
          if ($notes -match '^\s*$') { $notes = '' }
          python .github/scripts/make_latest_json.py --version $env:VERSION --tag $env:TAG --repo $env:GITHUB_REPOSITORY --installer $name --asset-name $name --sig-file $sig.FullName --notes $notes --out release/latest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build-vst3/VST3/Release/SetupCoachVoice.vst3 -DestinationPath "release/SetupCoachVoice-vst3_${env:VERSION}.zip"
          Get-Content release/latest.json
          Get-ChildItem release

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/*

      - name: Create DRAFT release (not published)
        shell: pwsh
        run: |
          $notes = "Draft created by CI. Check the files, then press Publish. Installed copies of Setup Coach offer this update the next time they start."
          gh release create $env:TAG release/* --draft --verify-tag --title "Setup Coach $env:VERSION" --notes $notes

# Builds and tests Setup Coach: core engine on Linux; Windows app installer +
# VST3 plugin on Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core engine (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo test -p coach_core --release

  windows:
    name: Windows app + VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test core + app (real Windows platform code)
        working-directory: .
        run: cargo test --workspace --release

      - name: Build app installer (unsigned)
        if: hashFiles('app/src-tauri/Cargo.toml') != ''
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build

      - name: Build + test VST3
        if: hashFiles('vst3/CMakeLists.txt') != ''
        run: |
          cmake -S vst3 -B build-vst3 -DSC_BUILD_PLUGIN=ON
          cmake --build build-vst3 --config Release
          ctest --test-dir build-vst3 -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: setup-coach-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: setup-coach-voice-vst3
          path: build-vst3/VST3/Release/*.vst3
          if-no-files-found: warn
